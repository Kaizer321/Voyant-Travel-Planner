<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voyant - AI Travel Planning Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #10a37f;
      --primary-hover: #0d8a6a;
      --bg-primary: #f9fafb;
      --bg-secondary: #f3f4f6;
      --text-primary: #2d333a;
      --text-secondary: #6e6e80;
      --border: #e5e7eb;
      --shadow: rgba(0, 0, 0, 0.05);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    /* Main Container */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-primary);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 16px;
      color: var(--text-primary);
    }

    .logo-icon {
      font-size: 24px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
    }

    /* Messages Area */
    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .messages::-webkit-scrollbar {
      width: 8px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .messages::-webkit-scrollbar-thumb:hover {
      background: #d0d0d0;
    }

    /* Message */
    .message {
      padding: 16px;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      background: var(--bg-primary);
    }

    .message.assistant {
      background: var(--bg-secondary);
    }

    .message-content {
      max-width: 768px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
    }

    /* User messages on the right */
    .message.user .message-content {
      justify-content: flex-end;
    }

    /* Assistant messages on the left */
    .message.assistant .message-content {
      justify-content: flex-start;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background: var(--primary);
      color: white;
      order: 2;
    }

    .message.assistant .avatar {
      background: var(--primary);
      color: white;
      order: 1;
    }

    .text {
      flex: 1;
      max-width: 70%;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-primary);
      padding: 12px 16px;
      border-radius: 18px;
    }

    .message.user .text {
      background: var(--primary);
      color: white;
      border-radius: 18px 18px 4px 18px;
      order: 1;
    }

    .message.assistant .text {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      order: 2;
    }

    /* Markdown Formatting */
    .text h1,
    .text h2,
    .text h3 {
      margin-top: 16px;
      margin-bottom: 8px;
      font-weight: 600;
      line-height: 1.3;
    }

    .text h1 {
      font-size: 20px;
    }

    .text h2 {
      font-size: 18px;
      color: var(--primary);
    }

    .text h3 {
      font-size: 16px;
    }

    .text h1:first-child,
    .text h2:first-child,
    .text h3:first-child {
      margin-top: 0;
    }

    .text p {
      margin-bottom: 12px;
    }

    .text ul,
    .text ol {
      margin: 8px 0 12px 0;
      padding-left: 24px;
    }

    .text li {
      margin-bottom: 6px;
      line-height: 1.6;
    }

    .text strong {
      font-weight: 600;
      color: var(--text-primary);
    }

    .text code {
      background: rgba(0, 0, 0, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }

    .text pre {
      background: rgba(0, 0, 0, 0.05);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 12px 0;
    }

    .text pre code {
      background: none;
      padding: 0;
    }

    .text blockquote {
      border-left: 3px solid var(--primary);
      padding-left: 12px;
      margin: 12px 0;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Typing Indicator */
    .typing {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(1) {
      animation-delay: 0s;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      30% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }

    /* Planning Animation */
    .planning-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 18px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .planning-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .empty-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 400px;
      line-height: 1.5;
    }

    /* Input Area */
    .input-area {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: var(--bg-primary);
    }

    .input-wrapper {
      max-width: 768px;
      margin: 0 auto;
      position: relative;
    }

    .input-field {
      width: 100%;
      padding: 12px 52px 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--bg-primary);
      resize: none;
      max-height: 200px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.1);
    }

    .input-field::placeholder {
      color: var(--text-secondary);
    }

    .send-btn {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 36px;
      height: 36px;
      background: var(--primary);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .send-icon {
      width: 18px;
      height: 18px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .message {
        padding: 20px 12px;
      }

      .message-content {
        gap: 12px;
      }

      .avatar {
        width: 28px;
        height: 28px;
        font-size: 16px;
      }

      .text {
        font-size: 14px;
      }

      .input-area {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <span class="logo-icon">✈️</span>
        <span>Voyant</span>
      </div>
      <div class="status">
        <span class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </div>

    <!-- Messages Area -->
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🧭</div>
        <div class="empty-title">Welcome to Voyant</div>
        <div class="empty-subtitle">
          Your intelligent travel planning assistant. Ask me anything about your next trip.
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="input" class="input-field" placeholder="Message Voyant..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg class="send-icon" fill="none" stroke="white" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8">
            </path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let isLoading = false;

    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const emptyState = document.getElementById('emptyState');
    const statusText = document.getElementById('statusText');

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
      sendBtn.disabled = !input.value.trim() || isLoading;
    });

    // Send on Enter (Shift+Enter for new line)
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) {
          sendMessage();
        }
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    function removeEmptyState() {
      if (emptyState) {
        emptyState.remove();
      }
    }

    function addMessage(role, content) {
      removeEmptyState();

      const msg = document.createElement('div');
      msg.className = `message ${role}`;

      const avatar = role === 'user' ? '👤' : '🤖';

      // Parse markdown for assistant messages
      const textContent = role === 'assistant' ? marked.parse(content) : escapeHtml(content);

      msg.innerHTML = `
        <div class="message-content">
          <div class="avatar">${avatar}</div>
          <div class="text">${textContent}</div>
        </div>
      `;

      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
      removeEmptyState();

      const msg = document.createElement('div');
      msg.className = 'message assistant';
      msg.id = 'typingIndicator';

      msg.innerHTML = `
        <div class="message-content">
          <div class="avatar">🤖</div>
          <div class="typing">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;

      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    function showPlanning() {
      removeTyping();

      const msg = document.createElement('div');
      msg.className = 'message assistant';
      msg.id = 'planningIndicator';

      msg.innerHTML = `
        <div class="message-content">
          <div class="avatar">🤖</div>
          <div class="planning-indicator">
            <div class="planning-spinner"></div>
            <span>Planning your perfect trip...</span>
          </div>
        </div>
      `;

      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    function removePlanning() {
      const planning = document.getElementById('planningIndicator');
      if (planning) planning.remove();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text || isLoading) return;

      addMessage('user', text);
      input.value = '';
      input.style.height = 'auto';
      isLoading = true;
      sendBtn.disabled = true;

      showTyping();

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(text);
      } else {
        removeTyping();
        statusText.textContent = 'Reconnecting...';
        connectWS();
      }
    }

    function connectWS() {
      try {
        const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const host = window.location.hostname;
        const port = '5000';

        ws = new WebSocket(`${proto}://${host}:${port}/ws`);

        ws.onopen = () => {
          statusText.textContent = 'Ready';
        };

        ws.onmessage = (event) => {
          removeTyping();
          removePlanning();
          try {
            const msg = JSON.parse(event.data);
            if (msg && msg.type && msg.text) {
              if (msg.type === 'agent' || msg.type === 'system') {
                // Check if this is a planning message
                if (msg.text.includes('Perfect! I have all the information') ||
                  msg.text.includes('search for the best options')) {
                  showPlanning();
                } else {
                  addMessage('assistant', msg.text);
                }
              }
            } else {
              addMessage('assistant', typeof msg === 'object' ? JSON.stringify(msg) : String(msg));
            }
          } catch {
            addMessage('assistant', event.data);
          }
          isLoading = false;
          sendBtn.disabled = !input.value.trim();
        };

        ws.onerror = () => {
          removeTyping();
          statusText.textContent = 'Error';
          isLoading = false;
          sendBtn.disabled = !input.value.trim();
        };

        ws.onclose = () => {
          removeTyping();
          statusText.textContent = 'Disconnected';
        };
      } catch (error) {
        console.error('Connection failed:', error);
        statusText.textContent = 'Error';
      }
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      connectWS();
    });
  </script>
</body>

</html>
